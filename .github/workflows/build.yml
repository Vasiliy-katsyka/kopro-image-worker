name: build-image-worker
on:
  workflow_dispatch:
    inputs:
      tag: { description: "image tag", required: true, default: "2.1" }
      worker: { description: "image (Qwen-Image, root dir) or video (LTX-2.3, video/ dir)", required: true, default: "image" }
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - name: Free disk + move Docker to /mnt (images are 25-50 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /opt/microsoft /usr/local/julia* /opt/az /usr/local/share/powershell
          sudo systemctl stop docker
          sudo mkdir -p /mnt/docker
          echo '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          df -h / /mnt
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build and push (image worker)
        if: inputs.worker != 'video'
        run: |
          IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kopro-image:${{ inputs.tag }}
          docker build -t $IMG .
          docker push $IMG
          df -h / /mnt
      - name: Build and push base (video worker, no big weights)
        if: inputs.worker == 'video'
        run: |
          BASE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kopro-video:${{ inputs.tag }}-base
          docker build -t $BASE video
          docker push $BASE
          docker system prune -af >/dev/null
          df -h / /mnt
      - name: Append weights one layer at a time (video worker)
        if: inputs.worker == 'video'
        run: |
          set -e
          curl -fsSL https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz | sudo tar -xz -C /usr/local/bin crane
          IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kopro-video:${{ inputs.tag }}
          REF=$IMG-base
          CK=https://huggingface.co/Lightricks/LTX-2.3-fp8/resolve/main/ltx-2.3-22b-distilled-fp8.safetensors
          TE=https://huggingface.co/Comfy-Org/ltx-2/resolve/main/split_files/text_encoders/gemma_3_12B_it_fp8_scaled.safetensors
          W=/mnt/w; sudo mkdir -p $W/models; sudo chown -R $USER $W
          for spec in "$CK 0 4 ck0" "$CK 1 4 ck1" "$CK 2 4 ck2" "$CK 3 4 ck3" "$TE 0 2 te0" "$TE 1 2 te1"; do
            set -- $spec
            python3 video/fetch_part.py $1 $W/models/$4.safetensors $2 $3
            chmod 644 $W/models/$4.safetensors
            tar -C $W -cf $W/layer.tar models/$4.safetensors
            rm $W/models/$4.safetensors
            crane append -b $REF -f $W/layer.tar -t $IMG
            rm $W/layer.tar
            REF=$IMG
            df -h /mnt | tail -1
          done
          crane config $IMG | head -c 300
